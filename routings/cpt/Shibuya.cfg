! Router Shibuya Configuration (CPT - CIDR)
enable
configure terminal
hostname Shibuya
interface FastEthernet0/0
 description P2P Link to Phantoma
 ip address 10.67.19.62 255.255.255.252
 no shutdown
interface FastEthernet0/1
 description Shibuya LAN (Lain & Mika via Switch13)
 ip address 10.67.18.193 255.255.255.192
 no shutdown
! Default Route via Phantoma
ip route 0.0.0.0 0.0.0.0 10.67.19.61
end
