! Router Phantoma Configuration (CPT - CIDR)
enable
configure terminal
hostname Phantoma
interface FastEthernet0/0
 description P2P Link to Knights
 ip address 10.67.19.58 255.255.255.252
 no shutdown
interface FastEthernet0/1
 description Phantoma LAN (Semi via Switch12)
 ip address 10.67.19.1 255.255.255.224
 no shutdown
interface FastEthernet1/0
 description P2P Link to Shibuya
 ip address 10.67.19.61 255.255.255.252
 no shutdown
! Route to Shibuya LAN via Shibuya
ip route 10.67.18.192 255.255.255.192 10.67.19.62
! Default Route via Knights
ip route 0.0.0.0 0.0.0.0 10.67.19.57
end
