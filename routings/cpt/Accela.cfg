! Router Accela Configuration (CPT - CIDR)
enable
configure terminal
hostname Accela
interface FastEthernet0/0
 description P2P Link to Schumann
 ip address 10.67.10.82 255.255.255.252
 no shutdown
interface FastEthernet0/1
 description Accela LAN (Omnipresence & Denpa)
 ip address 10.67.4.1 255.255.252.0
 no shutdown
! Default Route via Schumann
ip route 0.0.0.0 0.0.0.0 10.67.10.81
end
