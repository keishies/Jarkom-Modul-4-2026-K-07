! Router Schumann Configuration (CPT - CIDR)
enable
configure terminal
hostname Schumann
interface FastEthernet0/0
 description Link to Switch2 (Backbone)
 ip address 10.67.10.68 255.255.255.248
 no shutdown
interface FastEthernet0/1
 description Schumann Direct Link to Akashic
 ip address 10.67.10.73 255.255.255.248
 no shutdown
interface FastEthernet1/0
 description P2P Link to Accela
 ip address 10.67.10.81 255.255.255.252
 no shutdown
! Route to Accela Subnet
ip route 10.67.4.0 255.255.252.0 10.67.10.82
! Default Route via Wired Backbone Gateway
ip route 0.0.0.0 0.0.0.0 10.67.10.65
end
