! Router Copland Configuration (CPT - CIDR)
enable
configure terminal
hostname Copland
interface FastEthernet0/0
 description Link to Switch2 (Backbone)
 ip address 10.67.10.67 255.255.255.248
 no shutdown
interface FastEthernet0/1
 description Copland LAN (Masayuki via Switch4)
 ip address 10.67.8.1 255.255.254.0
 no shutdown
interface FastEthernet1/0
 description Copland Direct Link to Juri
 ip address 10.67.10.1 255.255.255.192
 no shutdown
! Default Route via Wired Backbone Gateway
ip route 0.0.0.0 0.0.0.0 10.67.10.65
end
