! Router Tachibana Configuration (CPT - CIDR)
enable
configure terminal
hostname Tachibana
interface FastEthernet0/0
 description P2P Link to Wired
 ip address 10.67.19.42 255.255.255.252
 no shutdown
interface FastEthernet0/1
 description Tachibana LAN (Collective & Ghost via Switch9)
 ip address 10.67.16.1 255.255.254.0
 no shutdown
interface FastEthernet1/0
 description P2P Link to Deus
 ip address 10.67.19.45 255.255.255.252
 no shutdown
! Route to Southern Downstream Subnets via Deus
ip route 10.67.18.0 255.255.254.0 10.67.19.46
! Default Route via Wired
ip route 0.0.0.0 0.0.0.0 10.67.19.41
end
