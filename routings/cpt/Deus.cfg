! Router Deus Configuration (CPT - CIDR)
enable
configure terminal
hostname Deus
interface FastEthernet0/0
 description P2P Link to Tachibana
 ip address 10.67.19.46 255.255.255.252
 no shutdown
interface FastEthernet0/1
 description Deus LAN (Lilith & Specter via Switch10)
 ip address 10.67.18.1 255.255.255.128
 no shutdown
interface FastEthernet1/0
 description P2P Link to Protocol7
 ip address 10.67.19.49 255.255.255.252
 no shutdown
! Routes to Downstream Subnets via Protocol7
ip route 10.67.18.128 255.255.255.128 10.67.19.50
ip route 10.67.19.0 255.255.255.0 10.67.19.50
! Default Route via Tachibana
ip route 0.0.0.0 0.0.0.0 10.67.19.45
end
