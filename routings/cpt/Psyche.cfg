! Router Psyche Configuration (CPT - CIDR)
enable
configure terminal
hostname Psyche
interface FastEthernet0/0
 description Link to Switch2 (Backbone)
 ip address 10.67.10.66 255.255.255.248
 no shutdown
interface FastEthernet0/1
 description Psyche LAN (Karl & Lin)
 ip address 10.67.0.1 255.255.252.0
 no shutdown
! Default Route via Wired Backbone Gateway
ip route 0.0.0.0 0.0.0.0 10.67.10.65
end
